plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.epom.prebiddemo"
    compileSdk 34

    defaultConfig {
        applicationId "com.epom.prebiddemo"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    // Play will not take an unsigned bundle, not even on an internal testing track. The key never
    // goes in the repository: copy keystore.properties.example to keystore.properties, fill it in,
    // and it stays ignored. Without that file the release build is simply unsigned, which is what
    // you want on a machine that has no business holding the key.
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file("keystore.properties")
    if (keystoreFile.exists()) {
        keystoreFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        release {
            if (keystoreProps.containsKey("storeFile")) {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreProps.containsKey("storeFile")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"

    // Prebid Mobile: fetches the bid and hands its targeting keys to Google.
    implementation "org.prebid:prebid-mobile-sdk:3.0.2"

    // Google Mobile Ads: the primary ad server. It renders both the Prebid winner
    // and, when nobody bids, its own demand — which is what makes this a backfill.
    implementation "com.google.android.gms:play-services-ads:25.4.0"
}
