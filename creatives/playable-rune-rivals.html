<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rune Rivals — playable</title>

<!-- The container injects mraid.js itself. It must be referenced with no src of
     our own and never bundled: a playable that ships its own copy talks to a
     stub instead of the SDK, and every open() and close() silently does nothing. -->
<script src="mraid.js"></script>

<style>
  :root { --accent:#ffcc33 }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }

  /* The creative owns a root of its own rather than styling body. It is embedded
     into someone else's document, where body may be shared, sized by the host or
     scrolled — and where position:fixed is measured against a viewport we do not
     control. Everything below is positioned against #ad instead. */
  html, body { margin:0; padding:0; height:100%; background:#141033 }
  #ad { position:absolute; inset:0; width:100%; height:100%; overflow:hidden;
        background:#141033; color:#fff; user-select:none; touch-action:manipulation;
        font:600 16px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif }

  #sky { position:absolute; inset:-30%; background:
      radial-gradient(38% 30% at 30% 25%, #4b3bd6 0%, transparent 60%),
      radial-gradient(34% 28% at 72% 68%, #7a2fb0 0%, transparent 62%);
    filter:blur(10px); animation:drift 14s ease-in-out infinite alternate }
  @keyframes drift { to { transform:translate3d(4%,-5%,0) scale(1.12) } }

  #hud { position:absolute; inset:0 0 auto 0; display:flex; justify-content:space-between;
         align-items:center; padding:14px 16px; font-size:14px; z-index:3 }
  #brand { display:flex; align-items:center; gap:8px }
  #brand b { font-weight:800 }

  .mk { display:block; color:var(--accent) }
  /* The mark is an outline, so the counter of the "e" shows whatever is behind it.
     Every surface here is dark, which is why the letter is light rather than the
     dark the source file carries. */
  .mk-e { fill:#fff }
  .brandmk { width:20px; height:23px; animation:spin 6s linear infinite }
  .brandmk .mk-e { fill:var(--accent) }
  .bigmk { width:46px; height:53px; margin:0 auto 18px }
  .rune .mk { width:38px; height:43px; color:#fff; filter:drop-shadow(0 2px 6px rgba(0,0,0,.4)) }
  @keyframes spin { to { transform:rotate(360deg) } }

  #score { display:flex; gap:9px; align-items:center }
  #score i { width:15px; height:15px; border-radius:4px; transform:rotate(45deg);
             border:2px solid rgba(255,255,255,.35); transition:background .25s, border-color .25s }
  #score i.lit { background:var(--accent); border-color:var(--accent);
                 animation:ignite .45s cubic-bezier(.2,1.7,.4,1) }
  @keyframes ignite {
    0%   { transform:rotate(45deg) scale(1);    box-shadow:0 0 0 0 rgba(255,204,51,.9) }
    45%  { transform:rotate(45deg) scale(1.75) }
    100% { transform:rotate(45deg) scale(1);    box-shadow:0 0 0 16px rgba(255,204,51,0) }
  }

  #stage { position:absolute; inset:0; z-index:2 }
  .rune { position:absolute; width:74px; height:74px; margin:-37px 0 0 -37px;
          border-radius:18px; background:linear-gradient(160deg,#6a5cff,#3a2fb0);
          border:2px solid rgba(255,255,255,.35); display:grid; place-items:center;
          box-shadow:0 10px 24px rgba(0,0,0,.35);
          animation:pop .22s cubic-bezier(.2,1.6,.4,1),
                    float var(--dur,7s) ease-in-out .22s infinite alternate }
  @keyframes pop { from { transform:scale(.4) rotate(-25deg); opacity:0 } }
  @keyframes float { to { transform:translate(var(--fx,40px),var(--fy,-52px)) rotate(6deg) } }
  .rune::after { content:''; position:absolute; inset:-10px; border-radius:24px;
          border:2px solid rgba(255,204,51,.55); animation:halo 1.5s ease-out infinite }
  @keyframes halo { to { transform:scale(1.5); opacity:0 } }
  .rune.gone { animation:bye .28s ease-in forwards }
  @keyframes bye { to { transform:scale(1.9) rotate(35deg); opacity:0 } }

  .spark { position:absolute; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%;
           background:var(--accent); pointer-events:none; animation:fly .5s ease-out forwards }
  @keyframes fly { to { transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0 } }

  /* The instruction opens in the middle, where the eye already is, and steps aside
     to the bottom once the first rune is struck — a centred pill over a live board
     would cover the very thing it is asking you to hit. */
  #hint { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:3;
          display:flex; align-items:center; gap:10px; white-space:nowrap;
          padding:16px 30px; border-radius:999px; font-size:17px; font-weight:800;
          color:#241a00; background:linear-gradient(100deg,#ffd85e,#ffb020);
          box-shadow:0 10px 30px rgba(255,176,32,.45);
          transition:top .45s cubic-bezier(.2,1.3,.4,1), padding .45s, font-size .45s;
          animation:cta 1.5s ease-in-out infinite }
  #hint.low { top:calc(100% - 52px); padding:13px 24px; font-size:15px }
  #hint .finger { font-size:20px; animation:poke 1.5s ease-in-out infinite }
  @keyframes cta { 50% { box-shadow:0 14px 42px rgba(255,176,32,.75) } }
  @keyframes poke { 50% { transform:translateY(-6px) } }

  #card { position:absolute; inset:0; display:none; place-items:center; text-align:center;
          background:rgba(8,6,26,.92); padding:24px; z-index:4 }
  #card.on { display:grid; animation:fade .35s ease-out both }
  @keyframes fade { from { opacity:0 } }
  #card > div { animation:rise .45s cubic-bezier(.2,1.4,.4,1) both .05s }
  @keyframes rise { from { transform:translateY(26px) scale(.94); opacity:0 } }
  #card h1 { font-size:28px; margin:10px 0 6px }
  #card p { opacity:.8; font-weight:400; margin:0 0 22px }
  #cta { display:inline-block; padding:15px 34px; border-radius:999px;
         background:var(--accent); color:#241a00; font-weight:800; font-size:17px;
         text-decoration:none; animation:beat 1.6s ease-in-out infinite }
  @keyframes beat { 50% { transform:scale(1.06) } }

  @media (prefers-reduced-motion:reduce) { * { animation:none !important } }
</style>

<script>
(function () {
  'use strict';

  var CLICK_URL = 'https://example.com/rune-rivals';
  var GLYPH = "<svg class=\"mk\" viewBox=\"0 0 36 41\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><path fill-rule=\"evenodd\" clip-rule=\"evenodd\" d=\"M2.84639 10.5302L16.8953 2.32475C17.3588 2.05403 17.9298 2.05403 18.3933 2.32475L32.4422 10.5302C32.9057 10.801 33.1913 11.3013 33.1913 11.8427V28.2537C33.1913 28.7951 32.9057 29.2954 32.4422 29.5662L18.3933 37.7716C17.9298 38.0424 17.3588 38.0424 16.8953 37.7716L2.84639 29.5662C2.38288 29.2954 2.09735 28.7951 2.09735 28.2537V11.8427C2.09735 11.3013 2.38288 10.801 2.84639 10.5302ZM15.8466 0.487294C16.959 -0.162431 18.3296 -0.162431 19.442 0.487294L33.4909 8.69278C34.6033 9.34251 35.2886 10.5433 35.2886 11.8427V28.2537C35.2886 29.5531 34.6033 30.7539 33.4909 31.4036L19.442 39.6091C18.3296 40.2588 16.959 40.2588 15.8466 39.6091L1.79774 31.4036C0.685322 30.7539 4.57764e-05 29.5531 4.57764e-05 28.2537V11.8427C4.57764e-05 10.5433 0.685322 9.34251 1.79774 8.69279L15.8466 0.487294Z\" fill=\"currentColor\"/><path fill-rule=\"evenodd\" clip-rule=\"evenodd\" d=\"M16.5129 11.0016C17.2126 10.5887 18.0778 10.5887 18.7774 11.0016L24.477 14.365C25.5671 15.0083 25.5671 16.6017 24.477 17.2449L18.7774 20.6084C18.0778 21.0213 17.2126 21.0213 16.5129 20.6084L14.2821 19.2919C13.7819 18.9967 13.6129 18.3471 13.9047 17.841C14.1965 17.335 14.8386 17.164 15.3389 17.4592L17.5697 18.7757C17.6163 18.8032 17.674 18.8032 17.7207 18.7757L22.7548 15.805L17.7207 12.8342C17.674 12.8067 17.6163 12.8067 17.5697 12.8342L11.5774 16.3704C11.5314 16.3976 11.5031 16.4474 11.5031 16.5013V23.5954C11.5031 23.6493 11.5314 23.6992 11.5774 23.7263L17.5697 27.2625C17.6163 27.29 17.674 27.29 17.7207 27.2625L24.3076 23.3754C24.8078 23.0802 25.4499 23.2512 25.7418 23.7573C26.0336 24.2633 25.8646 24.9129 25.3643 25.2081L18.7774 29.0952C18.0778 29.5081 17.2126 29.5081 16.5129 29.0952L10.5206 25.559C9.83027 25.1516 9.40576 24.4039 9.40576 23.5954V16.5013C9.40576 15.6928 9.83027 14.9451 10.5206 14.5377L16.5129 11.0016Z\" class=\"mk-e\"/></svg>";

  var NEEDED = 3, hits = 0, playing = false, mr = window.mraid;
  var stage = document.getElementById('stage');
  var score = document.getElementById('score');
  var card  = document.getElementById('card');
  var hint  = document.getElementById('hint');

  function burst(x, y) {
    for (var i = 0; i < 10; i++) {
      var a = (Math.PI * 2 * i) / 10, d = 46 + Math.random() * 34;
      var s = document.createElement('div');
      s.className = 'spark';
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.setProperty('--dx', (Math.cos(a) * d).toFixed(1) + 'px');
      s.style.setProperty('--dy', (Math.sin(a) * d).toFixed(1) + 'px');
      stage.appendChild(s);
      setTimeout(function (n) { return function () { n.remove(); }; }(s), 520);
    }
  }

  function place() {
    if (!playing) return;
    var r = document.createElement('div');
    r.className = 'rune';
    r.innerHTML = GLYPH;
    // Kept clear of the middle while the instruction still sits there.
    r.style.left = (16 + Math.random() * 68) + '%';
    r.style.top  = (hits === 0 ? 24 + Math.random() * 12 : 26 + Math.random() * 44) + '%';
    r.style.setProperty('--fx', (Math.random() * 120 - 60).toFixed(0) + 'px');
    r.style.setProperty('--fy', (Math.random() * 120 - 60).toFixed(0) + 'px');
    r.style.setProperty('--dur', (5 + Math.random() * 4).toFixed(1) + 's');
    r.addEventListener('click', function () {
      if (!playing || r.classList.contains('gone')) return;
      r.classList.add('gone');
      burst(r.offsetLeft, r.offsetTop);
      setTimeout(function () { r.remove(); }, 280);
      hits++;
      var pip = score.children[hits - 1];
      if (pip) pip.classList.add('lit');
      hint.classList.add('low');
      if (hits >= NEEDED) finish(); else place();
    });
    stage.appendChild(r);
  }

  function finish() {

    // The user has done the thing the reward is for. Prebid Mobile matches this exact URL

    // (the slot's stored impression names it) and then offers the close button; on a page

    // it is an unknown scheme and goes nowhere, which is the right thing there.

    try { location.href = 'epom://reward'; } catch (e) {}
    playing = false;
    hint.style.display = 'none';
    card.classList.add('on');
  }

  function start() {
    if (playing) return;
    playing = true;
    place();
  }

  document.getElementById('cta').addEventListener('click', function (e) {
    e.preventDefault();
    // Every SDK sends the click through mraid.open. window.open is blocked inside
    // an ad WebView, so a playable that uses it looks like a dead button; the
    // fallback exists only so the file can be opened in a plain browser.
    if (mr && typeof mr.open === 'function') mr.open(CLICK_URL);
    else window.open(CLICK_URL, '_blank');
  });

  // A playable must not start while it is off screen: the container loads it
  // early, and a game that ran there would be over before anyone saw it.
  function watchViewability() {
    if (!mr || typeof mr.addEventListener !== 'function') { start(); return; }
    if (typeof mr.isViewable === 'function' && mr.isViewable()) start();
    mr.addEventListener('viewableChange', function (v) { if (v) start(); });
  }

  if (!mr) start();
  else if (mr.getState() === 'loading') mr.addEventListener('ready', watchViewability);
  else watchViewability();
})();
</script>
